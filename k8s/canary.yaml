# Canary: most users stay on the stable version, 1 in 5 requests goes to the new one.
#   http://<vm-ip>:30083
# A small NGINX router does the 4:1 split.
# Rollback = scale aceest-canary-new to 0, then all traffic goes to stable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels:
    app: aceest-canary
    track: stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
    spec:
      imagePullSecrets:
        - name: dockerhub
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: 2026ht66008/aceest-fitness:v3.1.2
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: aceest-app
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  namespace: aceest
  labels:
    app: aceest-canary
    track: new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: new
  template:
    metadata:
      labels:
        app: aceest-canary
        track: new
    spec:
      imagePullSecrets:
        - name: dockerhub
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: 2026ht66008/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: aceest-app
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-stable
  namespace: aceest
spec:
  selector:
    app: aceest-canary
    track: stable
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-new
  namespace: aceest
spec:
  selector:
    app: aceest-canary
    track: new
  ports:
    - port: 80
      targetPort: 5000
---
# Router: users -> http://<vm-ip>:30083
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-canary-router
  namespace: aceest
data:
  default.conf: |
    # 4 of every 5 requests go to stable, 1 goes to the canary.
    upstream canary_pool {
        server aceest-canary-stable.aceest.svc.cluster.local:80 weight=4 max_fails=1 fail_timeout=10s;
        server aceest-canary-new.aceest.svc.cluster.local:80 weight=1 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://canary_pool;
            # If the canary is switched off (rollback), its share goes to stable
            proxy_next_upstream error timeout http_502 http_503;
            proxy_set_header Host $host;
            add_header X-Served-By $upstream_addr always;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-router
  namespace: aceest
  labels:
    app: aceest-canary-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary-router
  template:
    metadata:
      labels:
        app: aceest-canary-router
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: aceest-canary-router
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-router
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-canary-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
